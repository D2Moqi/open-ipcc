--- #################### cc相关配置 ####################
cc:
  freeswitch:
    fsRecordFile: /data/record  # freeswitch录音文件地址
    fsRecordFileSuffix: .wav # freeswitch录音文件文件后缀
    codec: '^^:G722:PCMU:PCMA' # 音频编码
    sampleRate: 8000 # 采样率
  websocket:
    path: /cc/ws # 路径
    sender-type: local # 消息发送的类型，可选值为 local、redis、rocketmq、kafka、rabbitmq
    sender-rocketmq:
      topic: ${spring.application.name}-cc-websocket # 消息发送的 RocketMQ Topic
      consumer-group: ${spring.application.name}-cc-websocket-consumer # 消息发送的 RocketMQ Consumer Group
    sender-rabbitmq:
      exchange: ${spring.application.name}-cc-websocket-exchange # 消息发送的 RabbitMQ Exchange
      queue: ${spring.application.name}-cc-websocket-queue # 消息发送的 RabbitMQ Queue
  audio-fork:
    auth-key: ipcc-audio-fork-2026 # mod_audio_fork 连接预共享密钥
    mix-type: mono # fork 混音类型(mono=仅主叫音频/mixed=双方混合/stereo=双声道)
    sample-rate: 16k # fork 音频采样率(8k=8000Hz/16k=16000Hz)
    ws-url: ws://39.107.224.184:58080${cc.websocket.path} # CC 服务 WebSocket 地址(FS mod_audio_fork 连接用)

--- #################### ipcc-fs-esl 自研 ESL 客户端配置 ####################
ipcc:
  fs:
    esl:
      # ---------- 连接配置 ----------
      connect-timeout-seconds: 5           # 连接超时（秒），默认 5
      command-timeout-seconds: 10          # 同步命令超时（秒），默认 10
      # ---------- 协议层配置 ----------
      max-frame-size: 1048576              # 最大帧大小（字节），默认 1MB
      max-header-lines: 256                # 最大头部行数，默认 256
      netty-worker-threads: 4              # Netty worker 线程数，默认 4
      # ---------- 自动重连配置 ----------
      max-reconnect-attempts: 0            # 最大重连次数，0=无限重连，默认 0
      reconnect-base-delay-seconds: 1      # 重连基础延迟（秒），默认 1
      reconnect-max-delay-seconds: 60      # 重连最大延迟（秒），默认 60
      # ---------- 健康检查配置 ----------
      health-check-interval-seconds: 30    # 健康检查间隔（秒），默认 30
      health-check-failure-threshold: 3    # 健康检查失败阈值（次），默认 3
      # ---------- 事件执行器配置 ----------
      event-executor-mode: CHANNEL_HASH    # 事件执行器模式：CHANNEL_HASH / SINGLE_THREAD / FIXED_THREAD_POOL
      event-thread-pool-size: 64           # 事件线程池大小（CHANNEL_HASH 模式下为哈希桶数量），对应旧 cc.freeswitch.threadNum
      event-queue-capacity: 10000          # 事件队列容量，对应旧 cc.freeswitch.queueCapacity
      event-rejected-policy: CALLER_RUNS   # 事件拒绝策略：CALLER_RUNS / ABORT / DISCARD
      # ---------- 分布式协调配置 ----------
      monitor-enabled: true                # 是否启用监听权协调，对应旧 cc.freeswitch.monitoringStrategy；true=group策略，false=none策略
      monitor-group: all                   # 监听组标识，对应旧 cc.freeswitch.group；"all" 表示监听所有 FS
      monitor-compete-interval-seconds: 10  # 监听权竞争间隔（秒），默认 10
      monitor-lock-expire-seconds: 30       # 监听锁过期时间（秒），默认 30
      monitor-heartbeat-interval-seconds: 10 # 心跳更新间隔（秒），默认 10

--- #################### sipproxy 模块配置（ipcc-sipproxy Starter） ####################
sipproxy:
  enabled: true # 是否启用 sipproxy（false 时自动配置不生效）
  instance-id: ${HOSTNAME:node1} # 实例 ID，用于集群广播与日志追踪，多实例部署时通过 HOSTNAME 环境变量区分
  sip:
    port: 5561 # SIP 栈 UDP/TCP 监听端口（与 cc.sip.port 保持一致）
    bind-address: 0.0.0.0 # SIP 栈绑定地址（0.0.0.0 监听所有网卡）
    public-ip: 39.107.224.184 # SIP 代理公网 IP（用于 Contact/Via 头改写，使外部能回信到此节点）
    public-port: 5561 # SIP 代理公网端口（通常与 sip.port 一致）
  websocket:
    enabled: true # 是否启用 SIP over WebSocket
    path: /sipproxy/ws # SIP WS endpoint 路径（与 /cc/ws 隔离）
    require-auth: false # 握手是否强制 token 校验（false 跳过扩展点校验，仅用于本地调试；true 时由 CcWsHandshakeAuthenticator 校验）
    auth-token-source: query # token 提取方式（query 从 URL 参数提取）
    token-query-param: token # URL 参数名（前端通过 ?token=xxx 传递）
  heartbeat:
    options-enabled: true # 是否启用 OPTIONS 心跳响应（JsSIP 客户端会定时发送 OPTIONS 保活）
    idle-timeout: 90 # 心跳超时（秒），超过此时间未收到任何 SIP 消息的 WS 连接视为僵尸连接
    zombie-clean-enabled: true # 是否启用僵尸会话清理
  cluster:
    sender-type: local # 广播类型：local|redis|rocketmq|rabbitmq|kafka（local 单实例）
    sender-redis-channel: 'ipcc:sipproxy:ws:broadcast' # Redis 广播 channel
  session:
    redis-key-prefix: 'ipcc:sipproxy:session:' # Redis Key 前缀（与代码常量对齐）
    session-ttl: 120 # 会话 TTL（秒）
    register-ttl: 3600 # 注册信息 TTL（秒）